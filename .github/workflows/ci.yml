name: CI

on:
  push:
    branches:
      - main
      - pdb-update
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate headers and run smoke build
        shell: pwsh
        run: |
          $searchRoots = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio",
            "${env:ProgramFiles}\Microsoft Visual Studio"
          )

          $vsDevCmd = Get-ChildItem -Path $searchRoots -Filter VsDevCmd.bat -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $vsDevCmd) {
            throw "VsDevCmd.bat was not found on the runner."
          }

          cmd /c "call `"$($vsDevCmd.FullName)`" -arch=x86 -host_arch=x64 && call ci_test_build.bat"