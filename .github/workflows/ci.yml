name: CI

on:
  push:
    branches:
      - main
      - pdb-update
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore MSVC developer command cache
        id: cache-msvc-devcmd
        uses: actions/cache@v4
        with:
          path: .ci-cache/vsdevcmd.txt
          key: ${{ runner.os }}-msvc-devcmd-v1

      - name: Resolve MSVC developer command path
        shell: pwsh
        run: |
          $cacheFile = Join-Path $env:GITHUB_WORKSPACE '.ci-cache\vsdevcmd.txt'
          $vsDevCmdPath = $null

          if (Test-Path $cacheFile) {
            $cachedValue = (Get-Content -Path $cacheFile -Raw).Trim()
            if ($cachedValue -and (Test-Path $cachedValue)) {
              $vsDevCmdPath = $cachedValue
            }
          }

          if (-not $vsDevCmdPath) {
            $searchRoots = @(
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio",
              "${env:ProgramFiles}\Microsoft Visual Studio"
            )

            $vsDevCmd = Get-ChildItem -Path $searchRoots -Filter VsDevCmd.bat -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $vsDevCmd) {
              throw "VsDevCmd.bat was not found on the runner."
            }

            $vsDevCmdPath = $vsDevCmd.FullName
            New-Item -ItemType Directory -Path (Split-Path -Parent $cacheFile) -Force | Out-Null
            Set-Content -Path $cacheFile -Value $vsDevCmdPath -NoNewline
          }

          "VS_DEVCMD_PATH=$vsDevCmdPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate headers and run smoke build
        shell: cmd
        run: call ci_test_build.bat