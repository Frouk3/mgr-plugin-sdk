name: CI

on:
  push:
    branches:
      - main
      - pdb-update
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate headers and run smoke build
        shell: cmd
        run: call ci_test_build.bat